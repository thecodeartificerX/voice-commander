[hotkey]
key = "scroll_lock"

[audio]
channels = 1
device = 13
output_dir = "outputs"

[transcription]
model_size = "small.en"
device = "cuda"
compute_type = "float16"
min_confidence = 0.30

[matching]
threshold = 85.0
scorer = "WRatio"

[feedback]
sounds_dir = "assets/sounds"
start_sound = "start.wav"
stop_sound = "stop.wav"
miss_sound = "miss.wav"

[vad]
threshold = 0.4
min_speech_duration_ms = 100
min_silence_duration_ms = 250
speech_pad_ms = 30
pre_roll_ms = 300
max_utterance_ms = 8000
sample_rate = 16000
window_samples = 512

[vad.gates]
min_word_count = 1
max_no_speech_prob = 0.6

[logging]
level = "INFO"
file = "voice-commander.log"
