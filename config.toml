[hotkey]
key = "scroll_lock"
# mute_key = "ctrl_r"

[audio]
channels = 1
device = 13
output_dir = "outputs"

[transcription]
model_size = "small.en"
device = "cuda"
compute_type = "float16"
min_confidence = 0.30

[feedback]
sounds_dir = "assets/sounds"
start_sound = "start.wav"
stop_sound = "stop.wav"
miss_sound = "miss.wav"

[vad]
threshold = 0.4
min_speech_duration_ms = 100
min_silence_duration_ms = 250
speech_pad_ms = 30
pre_roll_ms = 300
max_utterance_ms = 8000
# sample_rate and window_samples are fixed at 16000/512 (Silero VAD model requirement)

[vad.gates]
min_word_count = 1
max_no_speech_prob = 0.6

[logging]
level = "INFO"
file = "voice-commander.log"

[web]
enabled = true
host = "127.0.0.1"
port = 8765
auto_open_browser = true

[llm]
endpoint_url = "http://localhost:1234/v1"
model_id = "google/gemma-4-e4b"
default_browser = "chrome"
timeout_ms = 1200
warmup_timeout_ms = 5000
max_plan_steps = 12
warmup_on_startup = true
focus_fuzzy_threshold = 70
open_fuzzy_threshold = 70

[sprite]
enabled = true
corner = "bottom_right"
base_size_px = 128  # on-screen sprite size in pixels; bump up on 4K displays
offset_x = 16  # pixel gap from the chosen corner along the X axis
offset_y = 16  # pixel gap from the chosen corner along the Y axis
asset_path = "assets/sprite"
bubble_fade_ms = 2000  # speech-bubble fade-out duration after each utterance
heartbeat_timeout_ms = 3000  # sprite flips to CRASHED if no daemon heartbeat within this many ms
render_scale = 0.75  # fraction of window the cat fills (1.0 = edge-to-edge, 0.75 = 75 % with margin)
y_nudge_px = 16  # pixels to shift the cat upward from centre (positive = up)

# --- Cursor follow (sprite-side) -----------------------------------------------
# follow_cursor  = true
# follow_poll_hz = 30
# margin_x       = 8
# margin_y       = 8

# --- HUD overlay (sprite-side) -----------------------------------------------
[hud]
enabled                 = true
max_lines               = 5
hold_ms                 = 4000
fade_ms                 = 3000
font_size               = 13
width_px                = 220
offset_x                = -230
offset_y                = 0
llm_summary_timeout_ms  = 800
llm_fallback_enabled    = true
