[hotkey]
key = "scroll_lock"
# mute_key = "ctrl_r"

[audio]
channels = 1
device = 13
output_dir = "outputs"

[transcription]
model_size = "small.en"
device = "cuda"
compute_type = "float16"
min_confidence = 0.30

[matching]
threshold = 85.0
scorer = "WRatio"

[feedback]
sounds_dir = "assets/sounds"
start_sound = "start.wav"
stop_sound = "stop.wav"
miss_sound = "miss.wav"

[vad]
threshold = 0.4
min_speech_duration_ms = 100
min_silence_duration_ms = 250
speech_pad_ms = 30
pre_roll_ms = 300
max_utterance_ms = 8000
# sample_rate and window_samples are fixed at 16000/512 (Silero VAD model requirement)

[vad.gates]
min_word_count = 1
max_no_speech_prob = 0.6

[logging]
level = "INFO"
file = "voice-commander.log"

[web]
enabled = true
host = "127.0.0.1"
port = 8765
auto_open_browser = true

[llm_router]
enabled = false
# endpoint_url = "http://localhost:1234/v1"
# model_id = "google/gemma-4-e4b"
# timeout_ms = 600
# max_plan_steps = 8
# warmup_on_startup = true
