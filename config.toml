[hotkey]
key = "scroll_lock"
# Secondary hotkey: toggles mute within an active session (ADR 0025).
# Default ctrl_r — pressing right Ctrl during a session closes the audio
# stream, drains in-flight utterances, and stays in muted state until
# right Ctrl is pressed again. Set to "" to disable.
mute_key = "ctrl_r"

[audio]
device_name = "At 2020 (AT2020USB-X)"
channels = 1
device = 7
output_dir = "outputs"

[transcription]
model_size = "small.en"
device = "cuda"
compute_type = "float16"
min_confidence = 0.3

[feedback]
sounds_dir = "assets/sounds"
start_sound = "start.wav"
stop_sound = "stop.wav"
miss_sound = "miss.wav"

[vad]
threshold = 0.4
min_speech_duration_ms = 100
min_silence_duration_ms = 250
speech_pad_ms = 30
pre_roll_ms = 300
max_utterance_ms = 8000

[vad.gates]
min_word_count = 1
max_no_speech_prob = 0.6

[logging]
level = "INFO"
file = "voice-commander.log"

[web]
enabled = true
host = "127.0.0.1"
port = 8765
auto_open_browser = true

[sprite]
enabled = true
corner = "bottom_right"
base_size_px = 128
offset_x = 16
offset_y = 16
asset_path = "assets/sprite"
bubble_fade_ms = 2000
heartbeat_timeout_ms = 3000
render_scale = 0.75
y_nudge_px = 16
follow_cursor = true
follow_poll_hz = 30
margin_x = 8
margin_y = 8

[hud]
enabled = true
max_lines = 5
hold_ms = 4000
fade_ms = 3000
font_size = 13
width_px = 220

[perception]
ocr_engine = "auto"

