[hotkey]
key = "scroll_lock"

[audio]
channels = 1
device = 13
output_dir = "outputs"

[transcription]
model_size = "small.en"
device = "cuda"
compute_type = "float16"
min_confidence = 0.30

[matching]
threshold = 85.0
scorer = "WRatio"

[feedback]
sounds_dir = "assets/sounds"
start_sound = "start.wav"
stop_sound = "stop.wav"
miss_sound = "miss.wav"

[logging]
level = "INFO"
file = "voice-commander.log"

[web]
enabled = true
host = "127.0.0.1"
port = 8765
auto_open_browser = true
