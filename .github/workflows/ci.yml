name: CI

on:
  push:
    branches: [main, 'archon/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run python -m pytest tests/ --ignore=tests/integration -x -q --tb=short

  builder-ui:
    name: Builder UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/builder-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web/builder-ui
      - name: Type check
        run: pnpm typecheck
        working-directory: web/builder-ui
      - name: Lint
        run: pnpm lint
        working-directory: web/builder-ui
      - name: Unit tests
        run: pnpm test
        working-directory: web/builder-ui
      - name: Build
        run: pnpm build
        working-directory: web/builder-ui
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: builder-ui-dist
          path: src/voice_commander/web/static/builder/
          if-no-files-found: warn
