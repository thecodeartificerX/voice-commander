<form id="config-form" hx-post="/config" hx-target="#config-status" hx-swap="innerHTML"
      class="bg-neutral-900 border border-neutral-800 rounded-lg p-4 space-y-3">
    <h3 class="text-lg font-medium text-amber-300">Runtime Config</h3>

    <fieldset class="space-y-2">
        <legend class="text-xs uppercase text-neutral-500">[llm]</legend>
        <label class="block">
            <span class="text-xs text-neutral-400">endpoint_url</span>
            <input name="llm_endpoint_url" value="{{ cfg.get('llm', {}).get('endpoint_url', 'http://localhost:1234/v1') }}"
                   class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2"/>
        </label>
        <label class="block">
            <span class="text-xs text-neutral-400">model_id</span>
            <input name="llm_model_id" value="{{ cfg.get('llm', {}).get('model_id', '') }}"
                   class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2"/>
        </label>
        <div class="grid grid-cols-2 gap-3">
            <label class="block">
                <span class="text-xs text-neutral-400">default_browser</span>
                <input name="llm_default_browser" value="{{ cfg.get('llm', {}).get('default_browser', 'chrome') }}"
                       class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2"/>
            </label>
            <label class="block">
                <span class="text-xs text-neutral-400">timeout_ms</span>
                <input name="llm_timeout_ms" type="number" value="{{ cfg.get('llm', {}).get('timeout_ms', 1200) }}"
                       class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2"/>
            </label>
        </div>
    </fieldset>

    <fieldset class="space-y-2">
        <legend class="text-xs uppercase text-neutral-500">[audio]</legend>
        <label class="block">
            <span class="text-xs text-neutral-400">device (PortAudio index; -1 = system default)</span>
            <input name="audio_device" type="number" value="{{ cfg.get('audio', {}).get('device', -1) }}"
                   class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2"/>
        </label>
    </fieldset>

    <fieldset class="space-y-2">
        <legend class="text-xs uppercase text-neutral-500">[transcription]</legend>
        <div class="grid grid-cols-2 gap-3">
            <label class="block">
                <span class="text-xs text-neutral-400">model_size</span>
                <input name="transcription_model_size" value="{{ cfg.get('transcription', {}).get('model_size', 'small.en') }}"
                       class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2"/>
            </label>
            <label class="block">
                <span class="text-xs text-neutral-400">min_confidence</span>
                <input name="transcription_min_confidence" type="number" step="0.05" min="0" max="1"
                       value="{{ cfg.get('transcription', {}).get('min_confidence', 0.3) }}"
                       class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2"/>
            </label>
        </div>
    </fieldset>

    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-4 py-2 rounded bg-amber-700 hover:bg-amber-600 text-white">Save</button>
        <div id="config-status" class="text-sm"></div>
    </div>
</form>
