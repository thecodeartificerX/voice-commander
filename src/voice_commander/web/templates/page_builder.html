{% extends "_layout.html" %}
{% set active = 'builder' %}
{% block title %}Builder — Voice Commander{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/drawflow.min.css">
<link rel="stylesheet" href="/static/builder.css">
<div id="builder-root"
     data-existing='{{ existing | tojson if existing else "null" }}'
     data-kind="{{ kind }}">
  <div id="builder-header" class="flex flex-wrap gap-2 p-2 border-b border-neutral-700 bg-neutral-900 items-center">
    <input id="builder-name" class="bg-neutral-800 text-neutral-200 border border-neutral-600 rounded px-2 py-1 text-sm w-40" placeholder="graph name">
    <select id="builder-kind" class="bg-neutral-800 text-neutral-200 border border-neutral-600 rounded px-2 py-1 text-sm">
      <option value="command">command</option>
      <option value="workflow">workflow</option>
    </select>
    <label class="flex items-center gap-1 text-sm text-neutral-300">
      <input type="checkbox" id="builder-llm-visible" checked> llm_visible
    </label>
    <label class="flex items-center gap-1 text-sm text-neutral-300">
      <input type="checkbox" id="builder-strict" checked> strict
    </label>
    <input id="builder-description" class="bg-neutral-800 text-neutral-200 border border-neutral-600 rounded px-2 py-1 text-sm flex-1 min-w-32" placeholder="description">
    <button id="builder-validate" class="text-sm px-3 py-1 rounded bg-neutral-700 hover:bg-neutral-600 text-white">Validate</button>
    <button id="builder-save" class="text-sm px-3 py-1 rounded bg-teal-700 hover:bg-teal-600 text-white">Save</button>
    <a id="builder-cancel" href="/page/commands" class="text-sm px-3 py-1 rounded bg-neutral-700 hover:bg-neutral-600 text-neutral-200">Cancel</a>
    <span id="builder-status" class="text-sm"></span>
  </div>
  <div id="builder-errors" class="hidden px-3 py-2 bg-red-900/40 border-b border-red-700 text-red-300 text-sm"></div>
  <div class="flex" style="height:calc(100vh - 80px)">
    <div id="builder-palette" class="w-48 overflow-auto p-2 border-r border-neutral-700 bg-neutral-900 flex-shrink-0 text-sm"></div>
    <div id="builder-canvas" class="flex-1 relative overflow-hidden">
      <aside id="builder-runs-panel" class="builder-runs-panel">
        <header>
          <h3>Runs</h3>
          <label><input type="checkbox" id="live-mode-toggle" /> Live</label>
        </header>
        <div id="builder-runs-list" hx-get="/api/runs?limit=20" hx-trigger="load, every 10s" hx-swap="innerHTML">
          loading…
        </div>
      </aside>
    </div>
    <div id="builder-config" class="w-72 overflow-auto p-3 border-l border-neutral-700 bg-neutral-900 flex-shrink-0 text-sm"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/drawflow.min.js"></script>
<script src="/static/builder.js"></script>
<script src="https://unpkg.com/htmx.org@2.0.0"></script>
<script src="/static/runs.js"></script>
{% endblock %}
