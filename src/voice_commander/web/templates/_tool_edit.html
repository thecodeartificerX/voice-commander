<div id="tool-{{ tool.name }}" class="bg-neutral-900 border-2 border-emerald-700 rounded-lg p-4">
    <form hx-post="/tool/{{ tool.name }}" hx-target="#tool-{{ tool.name }}" hx-swap="outerHTML">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-medium text-emerald-400">Editing: {{ tool.name }}</h3>
            <div class="flex gap-2">
                <button type="button" hx-get="/tool/{{ tool.name }}/cancel" hx-target="#tool-{{ tool.name }}" hx-swap="outerHTML"
                    class="text-sm px-3 py-1 rounded bg-neutral-800 hover:bg-neutral-700 text-neutral-300">Cancel</button>
                <button type="submit"
                    class="text-sm px-3 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-white">Save</button>
            </div>
        </div>
        <div class="space-y-3">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Category</label>
                <input name="category" value="{{ tool.category }}"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-neutral-200 text-sm focus:border-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Description</label>
                <input name="description" value="{{ tool.description }}"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-neutral-200 text-sm focus:border-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Phrases (one per line)</label>
                <textarea name="phrases" rows="4"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-neutral-200 text-sm focus:border-emerald-500 focus:outline-none font-mono">{{ tool.phrases | join('\n') }}</textarea>
            </div>
        </div>
    </form>
</div>
