<form id="command-{{ cmd.name or 'new' }}"
      hx-post="/command/{{ cmd.name or 'new' }}"
      hx-target="this" hx-swap="outerHTML"
      class="bg-neutral-900 border border-emerald-800 rounded-lg p-4 space-y-3">
    <div class="flex items-center justify-between">
        <h3 class="text-lg font-medium text-emerald-400">{{ "New command" if is_new else "Edit " + cmd.name }}</h3>
        {% if not is_new %}
        <button type="button" hx-get="/command/{{ cmd.name }}/cancel"
                hx-target="#command-{{ cmd.name }}" hx-swap="outerHTML"
                class="text-sm px-3 py-1 rounded bg-neutral-800 hover:bg-neutral-700">Cancel</button>
        {% endif %}
    </div>

    {% if is_new %}
    <label class="block">
        <span class="text-xs uppercase text-neutral-400">Name (snake_case)</span>
        <input name="name" required pattern="[a-z][a-z0-9_]*" value="{{ cmd.name }}"
               class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-neutral-100"/>
    </label>
    {% endif %}

    <label class="block">
        <span class="text-xs uppercase text-neutral-400">Description</span>
        <input name="description" value="{{ cmd.description }}"
               class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-neutral-100"/>
    </label>

    <label class="block">
        <span class="text-xs uppercase text-neutral-400">Synonyms (one per line)</span>
        <textarea name="synonyms" rows="4"
                  class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-neutral-100 font-mono text-sm">{% for s in cmd.synonyms %}{{ s }}
{% endfor %}</textarea>
    </label>

    <div class="grid grid-cols-2 gap-3">
        <label class="block">
            <span class="text-xs uppercase text-neutral-400">Primitive</span>
            <select name="primitive"
                    class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-neutral-100">
                {% for p in ["press", "type", "focus", "open", "click", "scroll", "wait"] %}
                <option value="{{ p }}" {{ "selected" if cmd.primitive == p else "" }}>{{ p }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="block">
            <span class="text-xs uppercase text-neutral-400">Kwargs (JSON)</span>
            <input name="kwargs_json" value='{{ cmd.kwargs | tojson }}'
                   class="mt-1 w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-neutral-100 font-mono text-sm"/>
        </label>
    </div>

    <input type="hidden" name="enabled" value="{{ 'true' if cmd.enabled else 'false' }}"/>

    <div class="flex gap-2 pt-2">
        <button type="submit" class="px-4 py-2 rounded bg-emerald-700 hover:bg-emerald-600 text-white">Save</button>
    </div>
</form>
