category = "perception"

# Perception tools were used by the old agentic loop. They are disabled
# under the command/workflow architecture — the LLM never observes state
# directly; user commands run deterministic plans based on the transcript
# alone. The Python functions remain importable for future reuse but their
# registry entries are inert (enabled=false).

[tools.get_focused_window]
description = "[disabled] Return the focused window title + process."
phrases = []
enabled = false
llm_only = true
internal = true
settle_ms = 0

[tools.list_windows]
description = "[disabled] List visible non-minimized windows."
phrases = []
enabled = false
llm_only = true
internal = true
settle_ms = 0

[tools.get_clipboard]
description = "[disabled] Return current clipboard text."
phrases = []
enabled = false
llm_only = true
internal = true
settle_ms = 0

[tools.list_processes]
description = "[disabled] List running processes with visible windows."
phrases = []
enabled = false
llm_only = true
internal = true
settle_ms = 0

[tools.read_clipboard]
phrases = []
description = "Read the current Windows clipboard text. Returns empty string when the clipboard does not contain text."
enabled = true
settle_ms = 0
llm_only = true
internal = true

[tools.read_clipboard.returns.text]
type = "string"
description = "Clipboard contents (UTF-8). Empty string when no text is available."

[tools.get_active_window_title]
phrases = []
description = "Return the title of the currently focused window. Empty string when no foreground window."
enabled = true
settle_ms = 0
llm_only = true
internal = true

[tools.get_active_window_title.returns.title]
type = "string"
description = "Foreground window title (UTF-8). Empty when no foreground window."

[tools.get_cursor_pos]
phrases = []
description = "Return the current cursor screen position as (x, y)."
enabled = true
settle_ms = 0
llm_only = true
internal = true

[tools.get_cursor_pos.returns.x]
type = "integer"
description = "Cursor X coordinate (screen pixels)."

[tools.get_cursor_pos.returns.y]
type = "integer"
description = "Cursor Y coordinate (screen pixels)."
