category = "system"

# System tools are hidden from web UI surfaces (primitives page, Builder palette,
# /api/tools endpoint) but remain fully dispatchable by the LLM router and daemon.
# ``system = true`` is a UI-visibility flag only — it does not affect routing.

[tools.speak]
phrases = ["speak", "start dictation", "voice typing", "begin dictating"]
description = "Toggle Windows voice dictation on/off. Synthesizes a Right Ctrl press."
enabled = true
llm_only = true
internal = false
system = true
