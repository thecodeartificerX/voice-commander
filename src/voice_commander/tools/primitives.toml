category = "primitives"

[tools.focus]
phrases = []
description = "Focus a window matching the given target (process name or window title, fuzzy-matched)."
enabled = true
settle_ms = 200
llm_only = true

[tools.focus.args.target]
description = "Human utterance naming the window to focus (e.g. 'notepad', 'chrome', 'spotify'). Fuzzy-matched against process names and window titles."
required = true
type = "string"

[tools.type]
phrases = []
description = "Type arbitrary text via keystroke synthesis into the currently focused window."
enabled = true
settle_ms = 50
llm_only = true

[tools.type.args.text]
description = "The text to type. Truncated to 500 characters with a warning log when exceeded."
required = true
type = "string"

[tools.open]
phrases = []
description = "Open an application, file, URI, or Start Menu entry. Resolves fuzzy app names via Start Menu and shell:AppsFolder."
enabled = true
settle_ms = 500
llm_only = true

[tools.open.args.target]
description = "Application name ('spotify'), URI ('https://example.com'), or file path. App names are fuzzy-matched against Start Menu and AppsFolder entries."
required = true
type = "string"

[tools.close]
phrases = []
description = "Close the current tab/document via Ctrl+W. DEFAULT for any bare 'close' utterance. Do NOT use close_window for a plain 'close' — only when the user explicitly says 'close window', 'close app', or 'quit'."
enabled = true
settle_ms = 100
llm_only = true

[tools.close_window]
phrases = []
description = "Close the entire focused window (Alt+F4). ONLY use when the user explicitly says 'close window', 'close app', 'close application', or 'quit'. For bare 'close', use the `close` tool instead."
enabled = true
settle_ms = 100
llm_only = true

[tools.minimize]
phrases = []
description = "Minimize a single window (defaults to the currently focused window). ALWAYS use this tool for 'minimize' utterances. NEVER emit press(combo='win+d') or press(combo='win+m') — those minimize everything."
enabled = true
settle_ms = 100
llm_only = true

[tools.minimize.args.target]
description = "Optional process name or window title (fuzzy-matched). Omit to minimize the focused window only."
required = false
type = "string"

[tools.maximize]
phrases = []
description = "Maximize a single window (defaults to the currently focused window). ALWAYS use this tool for 'maximize' utterances. NEVER emit press(combo='win+up')."
enabled = true
settle_ms = 100
llm_only = true

[tools.maximize.args.target]
description = "Optional process name or window title (fuzzy-matched). Omit to maximize the focused window only."
required = false
type = "string"

[tools.last]
phrases = []
description = "Switch back. DEFAULT (no args) issues Alt+Tab to return to the previous window. With tab=true, issues Ctrl+Tab to switch to the next tab inside the currently focused app. DEFAULT for 'last', 'last window', 'previous window', 'go back', 'last tab', 'next tab', 'switch tab' utterances. NEVER emit press(combo='alt+tab'), press(combo='ctrl+tab'), or press(combo='ctrl+shift+tab') — always use last()."
enabled = true
settle_ms = 100
llm_only = true

[tools.last.args.tab]
description = "When true, switch tab in the current app via Ctrl+Tab. When false (default), switch to the previous window via Alt+Tab."
required = false
type = "boolean"
default = false

[tools.press]
phrases = []
description = "Press a key combination like 'ctrl+c', 'alt+tab', 'win+l'."
enabled = true
settle_ms = 50
llm_only = true

[tools.press.args.combo]
description = "Key combination string with '+' separator (e.g. 'ctrl+c', 'alt+tab', 'win+shift+s')."
required = true
type = "string"

[tools.wait]
phrases = []
description = "Pause execution for the specified milliseconds before the next step."
enabled = true
settle_ms = 0
llm_only = true

[tools.wait.args.ms]
description = "Duration to wait in milliseconds."
required = true
type = "integer"

[tools.click]
phrases = []
description = "Click the mouse at the current cursor position."
enabled = true
settle_ms = 50
llm_only = true

[tools.click.args.button]
description = "Mouse button: 'left', 'right', or 'middle'. Defaults to 'left'."
required = false
type = "string"
default = "left"

[tools.summon_commander]
phrases = []
description = "Spawn a visible PowerShell window in the voice-commander repo and run `ccd`. ONLY use for exact utterances 'summon commander', 'spawn commander', or 'summon the commander'. NEVER use for 'open commander', 'focus commander', or any generic 'open X' / 'focus X' utterance — those go to open() or focus() respectively."
enabled = true
settle_ms = 500
llm_only = true

[tools.mute]
phrases = []
description = "End the voice session — equivalent to pressing the Scroll Lock hotkey. DEFAULT for utterances like 'mute', 'mute yourself', 'stop listening', 'shut up', 'be quiet'. No arguments."
enabled = true
settle_ms = 0
llm_only = true

[tools.no_match]
phrases = []
description = "Signal that the utterance is not an executable command (casual speech, nonsense)."
enabled = true
settle_ms = 0
llm_only = true

[tools.no_match.args.reason]
description = "Brief explanation of why no tool matched."
required = true
type = "string"

[tools.scroll]
phrases = []
description = "Scroll the active window up or down."
enabled = true
settle_ms = 0
llm_only = true

[tools.scroll.args.direction]
description = "Scroll direction: 'up' or 'down'."
required = true
type = "string"

[tools.scroll.args.amount]
description = "Number of scroll clicks."
required = false
type = "integer"
default = 3
