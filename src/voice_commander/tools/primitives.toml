category = "primitives"

# Primitive verbs dispatch to the OS (keystrokes, window focus, app launch).
# Most are marked ``internal = true`` so they are hidden from direct VerbRouter
# matching; user-defined commands and workflows are the primary routing surface.
#
# Exceptions (internal=false):
#   - ``press``: raw keystroke for bare key-name utterances ("control T", "enter").

[tools.focus]
phrases = []
description = "Focus a window matching the given target (process name or window title, fuzzy-matched)."
enabled = true
settle_ms = 200
llm_only = true
internal = true

[tools.focus.args.target]
description = "Window to focus (e.g. 'notepad', 'chrome', 'spotify'). Fuzzy-matched against process names and window titles. Optional when '_hwnd' is supplied."
required = false
type = "string"
widget_kind = "window-picker"
default = ""

[tools.focus.args._hwnd]
description = "Pre-resolved Win32 window handle. Set by the bare-primitive picker; skips fuzzy resolution when non-zero."
required = false
type = "integer"
default = 0

[tools.focus.returns.hwnd]
type = "integer"
description = "Win32 window handle of the foregrounded window."

[tools.type]
phrases = []
description = "Type arbitrary text via keystroke synthesis into the currently focused window."
enabled = true
settle_ms = 50
llm_only = true
internal = true

[tools.type.args.text]
description = "The text to type. Truncated to 500 characters with a warning log when exceeded."
required = true
type = "string"

[tools.open]
phrases = []
description = "Open an application, file, URI, or Start Menu entry. Resolves fuzzy app names via Start Menu and shell:AppsFolder."
enabled = true
settle_ms = 500
llm_only = true
internal = true

[tools.open.args.target]
description = "Application name ('spotify'), URI ('https://example.com'), or file path."
required = true
type = "string"
widget_kind = "app-picker"

[tools.open.returns.hwnd]
type = "integer"
description = "Win32 window handle of the verified-launched window, or 0 if verification timed out."

[tools.press]
phrases = []
description = "Press a raw key combination on the focused window. Use this when the transcript is bare key names — modifiers (ctrl/alt/shift/win), named keys (enter, tab, esc, scrolllock, space, backspace, delete, arrows, f1-f12), a single letter, or a single digit. Examples: 'control t' → press('ctrl+t'); 'scroll lock' → press('scrolllock'); 'enter shift control' → press('ctrl+shift+enter'); 'a' → press('a'); '5' → press('5')."
enabled = true
settle_ms = 50
llm_only = true
internal = false

[tools.press.args.combo]
description = "Key combination string with '+' separator (e.g. 'ctrl+c', 'alt+tab', 'win+shift+s')."
required = true
type = "string"

[tools.wait]
phrases = []
description = "Pause execution for the specified milliseconds before the next step."
enabled = true
settle_ms = 0
llm_only = true
internal = true

[tools.wait.args.ms]
description = "Duration to wait in milliseconds."
required = true
type = "integer"

[tools.click]
phrases = []
description = "Click the mouse at the current cursor position."
enabled = true
settle_ms = 50
llm_only = true
internal = true

[tools.click.args.button]
description = "Mouse button: 'left', 'right', or 'middle'. Defaults to 'left'."
required = false
type = "string"
default = "left"

[tools.scroll]
phrases = []
description = "Scroll the active window up or down."
enabled = true
settle_ms = 0
llm_only = true
internal = true

[tools.scroll.args.direction]
description = "Scroll direction: 'up' or 'down'."
required = true
type = "string"

[tools.scroll.args.amount]
description = "Number of scroll clicks."
required = false
type = "integer"
default = 3

[tools.tabs]
phrases = []
description = "Activate a page tab in a Chromium-derived browser (Chrome, Edge, Brave, Comet, ...). Dispatched only by the bare-primitive 'tabs' picker — never called directly by the LLM or user."
enabled = true
settle_ms = 100
llm_only = true
internal = true

[tools.tabs.args._browser_hwnd]
description = "Win32 window handle of the browser. Resolved by the picker at enumeration time."
required = false
type = "integer"
default = 0

[tools.tabs.args._tab_index]
description = "Zero-based index of the tab in the strip at enumeration time."
required = false
type = "integer"
default = -1

[tools.tabs.args._tab_title]
description = "Tab title captured at enumeration time. Used as a fallback match when the strip shifts between picker open and selection."
required = false
type = "string"
default = ""

[tools.tabs.returns.ok]
type = "integer"
description = "1 if the tab was activated, 0 on failure."
