category = "primitives"

# Primitive verbs dispatch to the OS (keystrokes, window focus, app launch).
# They are marked ``internal = true`` so the LLM never sees them directly —
# user-defined commands and workflows in commands.json / workflows.json are
# the only surface the LLM routes against.
#
# ``no_match`` is the exception: it stays LLM-visible as the "nothing matched"
# escape hatch. It maps to a no-op Python function.
#
# Tools kept enabled=true (still dispatchable via commands/workflows):
#   focus, type, open, press, wait, click, scroll, no_match
#
# Legacy semantic verbs (close, close_window, minimize, maximize, last,
# summon_commander, mute, done, ask_user) are retained in the registry so
# their Python functions stay importable, but they are disabled — invisible
# to every caller. Equivalent behaviour is now expressed as user commands
# (close_tab → press(ctrl+w), close_window → press(alt+f4), minimize →
# press(win+down), etc.).

[tools.focus]
phrases = []
description = "Focus a window matching the given target (process name or window title, fuzzy-matched)."
enabled = true
settle_ms = 200
llm_only = true
internal = true

[tools.focus.args.target]
description = "Window to focus (e.g. 'notepad', 'chrome', 'spotify'). Fuzzy-matched against process names and window titles."
required = true
type = "string"

[tools.focus.returns.hwnd]
type = "integer"
description = "Win32 window handle of the foregrounded window."

[tools.type]
phrases = []
description = "Type arbitrary text via keystroke synthesis into the currently focused window."
enabled = true
settle_ms = 50
llm_only = true
internal = true

[tools.type.args.text]
description = "The text to type. Truncated to 500 characters with a warning log when exceeded."
required = true
type = "string"

[tools.open]
phrases = []
description = "Open an application, file, URI, or Start Menu entry. Resolves fuzzy app names via Start Menu and shell:AppsFolder."
enabled = true
settle_ms = 500
llm_only = true
internal = true

[tools.open.args.target]
description = "Application name ('spotify'), URI ('https://example.com'), or file path."
required = true
type = "string"

[tools.open.returns.hwnd]
type = "integer"
description = "Win32 window handle of the verified-launched window, or 0 if verification timed out."

[tools.press]
phrases = []
description = "Press a key combination like 'ctrl+c', 'alt+tab', 'win+l'."
enabled = true
settle_ms = 50
llm_only = true
internal = true

[tools.press.args.combo]
description = "Key combination string with '+' separator (e.g. 'ctrl+c', 'alt+tab', 'win+shift+s')."
required = true
type = "string"

[tools.wait]
phrases = []
description = "Pause execution for the specified milliseconds before the next step."
enabled = true
settle_ms = 0
llm_only = true
internal = true

[tools.wait.args.ms]
description = "Duration to wait in milliseconds."
required = true
type = "integer"

[tools.click]
phrases = []
description = "Click the mouse at the current cursor position."
enabled = true
settle_ms = 50
llm_only = true
internal = true

[tools.click.args.button]
description = "Mouse button: 'left', 'right', or 'middle'. Defaults to 'left'."
required = false
type = "string"
default = "left"

[tools.scroll]
phrases = []
description = "Scroll the active window up or down."
enabled = true
settle_ms = 0
llm_only = true
internal = true

[tools.scroll.args.direction]
description = "Scroll direction: 'up' or 'down'."
required = true
type = "string"

[tools.scroll.args.amount]
description = "Number of scroll clicks."
required = false
type = "integer"
default = 3

# --- Legacy semantic verbs (disabled — superseded by user commands) -----------

[tools.close]
phrases = []
description = "[disabled] Use a close_tab command instead (press ctrl+w)."
enabled = false
settle_ms = 100
llm_only = true
internal = true

[tools.close_window]
phrases = []
description = "[disabled] Use a close_window command instead (press alt+f4)."
enabled = false
settle_ms = 100
llm_only = true
internal = true

[tools.minimize]
phrases = []
description = "[disabled] Use a minimize command instead (press win+down)."
enabled = false
settle_ms = 100
llm_only = true
internal = true

[tools.minimize.args.target]
description = "Optional process name or window title."
required = false
type = "string"

[tools.maximize]
phrases = []
description = "[disabled] Use a maximize command instead (press win+up)."
enabled = false
settle_ms = 100
llm_only = true
internal = true

[tools.maximize.args.target]
description = "Optional process name or window title."
required = false
type = "string"

[tools.last]
phrases = []
description = "[disabled] Use a last_window / last_tab command instead."
enabled = false
settle_ms = 100
llm_only = true
internal = true

[tools.last.args.tab]
description = "When true, switch tab via Ctrl+Tab. Default false → Alt+Tab."
required = false
type = "boolean"
default = false

[tools.last.returns.hwnd]
type = "integer"
description = "Win32 window handle of the new foreground window (0 for Ctrl+Tab path)."

[tools.summon_commander]
phrases = []
description = "[disabled] Spawn a PowerShell window. Repurpose as a command if still needed."
enabled = false
settle_ms = 500
llm_only = true
internal = true

[tools.mute]
phrases = []
description = "[disabled] End the voice session. Scroll Lock still works as the hardware mute."
enabled = false
settle_ms = 0
llm_only = true
internal = true

[tools.done]
phrases = []
description = "[disabled] Legacy agentic-loop terminator. No longer used."
enabled = false
settle_ms = 0
llm_only = true
internal = true

[tools.done.args.success]
description = "Whether the goal was achieved."
type = "boolean"
default = true

[tools.done.args.summary]
description = "Optional one-line summary."
type = "string"
default = ""

[tools.ask_user]
phrases = []
description = "[disabled] Legacy HUD clarifying question. Not wired in the command/workflow architecture."
enabled = false
settle_ms = 0
llm_only = true
internal = true

[tools.ask_user.args.question]
description = "The question to display to the user."
type = "string"

[tools.ask_user.args.options]
description = "Comma-separated numbered options."
type = "string"
default = ""

# --- LLM escape hatch ---------------------------------------------------------

[tools.no_match]
phrases = []
description = "Signal that the utterance does not match any command or workflow."
enabled = true
settle_ms = 0
llm_only = true
# ``no_match`` stays LLM-visible — it is the only non-command tool the LLM sees.
internal = false

[tools.no_match.args.reason]
description = "Brief explanation of why no command matched."
required = true
type = "string"
