# Metadata for the sprite companion character sheet.
# Source: CatPackPaid/Sprites/Halloween/witch.png (witch-hat pixel-art cat).
# Each [states.*] entry maps a SpriteState to a row (0-indexed) in charsheet.png.
#
# Cell pitch = 32 x 48 px (16 cols x 21 rows of content + 16 px trailing pad).
# Native pack cat body = 32x32; this witch variant adds a hat that pushes
# content to 32x48 tall. Some rows (row 2 flop, row 6 sleep) use wider
# 48-wide poses — those states override `frame_width` below.
#
# Verify any mapping change with `uv run python scripts/dump_sprite_slices.py`.
# Regenerate / swap art per ./README.md.

frame_width = 32
frame_height = 48
fps = 8

# -- Canonical states -------------------------------------------------------
# row 6 — sleeping curled cat (same pose as CRASHED).
# Used when no session (gates closed) or when muted — cat is NOT
# listening, so it visibly snoozes. Distinct from LISTENING's alert
# sitting pose. Muted override in SpriteRenderer also maps to this anim.
[states.idle]
row = 6
frames = 10
frame_width = 48

# row 0 — default sitting witch cat, engaged / alert tail sway.
# Used when session is open and actively listening for commands.
# (Row 1 has an alt sitting pose; kept unassigned for now.)
[states.listening]
row = 0
frames = 10

# row 4 — mouth-open meow / reacting to heard speech.
[states.hearing_speech]
row = 4
frames = 8

# row 7 — walking witch cat — mid processing / locomotion.
[states.thinking]
row = 7
frames = 9

# row 5 — standing holding glowing orb — spellcasting LLM call.
[states.llm_thinking]
row = 5
frames = 12

# row 0 (reused) — happy outcome chirp.
[states.success]
row = 0
frames = 10

# row 2 — lying / flopped — command not understood.
# 48-wide pose (cat with tail outstretched).
[states.miss]
row = 2
frames = 4
frame_width = 48

# row 3 — startled ghost float — tool execution failed.
[states.tool_error]
row = 3
frames = 4

# row 0 (reused) — warmup = idle sitting at start.
[states.warmup]
row = 0
frames = 10

# row 6 — sleeping curled — daemon gone, sprite crashed.
# 48-wide pose (sleep cat with long tail).
[states.crashed]
row = 6
frames = 10
frame_width = 48

# -- Transitions ------------------------------------------------------------
# No dedicated transition rows. States snap instantly.
