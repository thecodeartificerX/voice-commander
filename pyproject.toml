[project]
name = "voice-commander"
version = "0.1.0"
description = "Voice-driven Windows command launcher"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pynput>=1.7.7",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    "rapidfuzz>=3.9.0",
    "pyautogui>=0.9.54",
    "tomli>=2.0.1; python_version < '3.11'",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.21.0.82",
    "psutil>=5.9",
    "pywin32>=306",
    "silero-vad>=5.1",
    "onnxruntime>=1.16.1",
    "soxr>=0.3.7",
]

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "Pillow>=10.2.0"]

[project.scripts]
voice-commander = "voice_commander.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_commander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: requires microphone/GPU/real OS integration",
    "integration: end-to-end tests with canned fixtures",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "ctranslate2.*",
    "sounddevice.*",
    "soundfile.*",
    "silero_vad.*",
    "soxr.*",
    "pynput.*",
    "pyautogui.*",
    "psutil.*",
    "win32con.*",
    "win32gui.*",
    "win32process.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/voice_commander"]
branch = true
# Exclude thin hardware-wrapper modules — tested via -m hardware not unit suite.
omit = [
    "src/voice_commander/_cuda_setup.py",
    "src/voice_commander/__main__.py",
    "src/voice_commander/hotkey.py",
    "src/voice_commander/transcriber.py",
    "src/voice_commander/tools/_win32.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
