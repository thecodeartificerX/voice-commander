[project]
name = "voice-commander"
version = "0.1.0"
description = "Local-first voice command launcher for Windows — say the actual command, not a memorized shortcut."
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Sakib R"}]
keywords = ["voice", "speech-to-text", "automation", "windows", "whisper", "command-launcher", "voice-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]
dependencies = [
    "pynput>=1.7.7",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    "pyautogui>=0.9.54",
    "tomli>=2.0.1; python_version < '3.11'",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.21.0.82",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "portalocker>=2.8.0",
    "onnxruntime>=1.16.1",
    "soxr>=0.3.7",
    "httpx>=0.27.0",
    "pyglet>=2.0",
    "httpx-sse>=0.4.0",
    "rapidfuzz>=3.14.5",
    "watchdog>=6.0.0",
    "uiautomation>=2.0.29",
    "websockets>=14.0",
]

[project.urls]
Homepage = "https://github.com/thecodeartificerX/voice-commander"
Repository = "https://github.com/thecodeartificerX/voice-commander"
Issues = "https://github.com/thecodeartificerX/voice-commander/issues"
Documentation = "https://github.com/thecodeartificerX/voice-commander/tree/main/docs"

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "Pillow>=10.2.0"]

[project.scripts]
voice-commander = "voice_commander.__main__:main"
voice-sprite = "voice_sprite.__main__:main"
voice-commander-supervisor = "voice_commander.supervisor:main"
voice-dictation-stream = "voice_commander.dictation_stream.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_commander", "src/voice_sprite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires microphone/GPU/real OS integration",
    "integration: end-to-end tests with canned fixtures",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "ctranslate2.*",
    "sounddevice.*",
    "soundfile.*",
    "soxr.*",
    "pynput.*",
    "pyautogui.*",
    "psutil.*",
    "win32con.*",
    "win32gui.*",
    "win32process.*",
    "win32api.*",
    "win32com.*",
    "win32com.client",
    "pythoncom.*",
    "rapidfuzz.*",
    "pyglet.*",
    "httpx_sse.*",
    "winrt.*",
    "win32clipboard.*",
    "uiautomation",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/voice_commander", "src/voice_sprite"]
branch = true
# Exclude thin hardware-wrapper modules — tested via -m hardware not unit suite.
omit = [
    "src/voice_commander/_cuda_setup.py",
    "src/voice_commander/__main__.py",
    "src/voice_commander/hotkey.py",
    "src/voice_commander/transcriber.py",
    "src/voice_commander/tools/_win32.py",
    "src/voice_sprite/__main__.py",
    "src/voice_sprite/dpi.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
