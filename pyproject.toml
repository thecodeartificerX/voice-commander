[project]
name = "voice-commander"
version = "0.1.0"
description = "Voice-driven Windows command launcher"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pynput>=1.7.7",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    "rapidfuzz>=3.9.0",
    "pyautogui>=0.9.54",
    "tomli>=2.0.1; python_version < '3.11'",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.21.0.82",
]

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "Pillow>=10.2.0"]

[project.scripts]
voice-commander = "voice_commander.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_commander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: requires microphone/GPU/real OS integration",
    "integration: end-to-end tests with canned fixtures",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
