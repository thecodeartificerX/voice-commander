name: archon-idea-to-pr
description: |
  Use when: You have a feature idea or description and want end-to-end development.
  Input: Feature description in natural language, or path to a PRD file
  Output: PR ready for merge with comprehensive review completed

  Full workflow:
  1. Create comprehensive implementation plan with codebase analysis
  2. Setup branch and extract scope limits
  3. Verify plan research is still valid
  4. Implement all tasks with type-checking
  5. Run full validation suite
  6. Create PR with template, mark ready
  7. Comprehensive code review (5 parallel agents with scope limit awareness)
  8. Synthesize and fix review findings
  9. Final summary with decision matrix -> GitHub comment + follow-up recommendations

  NOT for: Executing existing plans (use archon-plan-to-pr), quick fixes, standalone reviews.

provider: claude

# ── MODEL STRATEGY (queen-bee division of labour) ──────────────────────────
# Default: sonnet — handles all read-heavy reasoning, code-writing, validation,
#   PR description writing, and anything well-scoped.
#
# Explicit overrides applied per node:
#   opus  → create-plan (architecture tradeoffs, bounded input)
#           code-review, error-handling (correctness/security, wrong-answer cost high)
#           synthesize (bounded-input multi-agent synthesis)
#   haiku → review-scope (extractive: PR scope/size)
#           test-coverage, comment-quality, docs-impact (mechanical pattern matching)
#           workflow-summary (status report-back)
#   sonnet (explicit, for documentation clarity) → implement-tasks, implement-fixes
#
# LOOP NODE CONSTRAINT: if Archon strips model: from loop-type nodes,
#   those nodes inherit this workflow-level default (sonnet). The heaviest
#   loop in this workflow is implement-tasks (code-writing) — sonnet is correct.
# ───────────────────────────────────────────────────────────────────────────
model: sonnet

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 0: CREATE PLAN — Opus (planning)
  # ═══════════════════════════════════════════════════════════════════

  - id: create-plan
    command: archon-create-plan
    context: fresh
    model: opus  # architecture tradeoffs, bounded input — wrong-answer cost high

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: archon-plan-setup
    depends_on: [create-plan]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: confirm-plan
    command: archon-confirm-plan
    depends_on: [plan-setup]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT — grunt code-writing → Sonnet
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-tasks
    command: archon-implement-tasks
    depends_on: [confirm-plan]
    context: fresh
    model: sonnet

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: VALIDATE
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement-tasks]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINALIZE PR
  # ═══════════════════════════════════════════════════════════════════

  - id: finalize-pr
    command: archon-finalize-pr
    depends_on: [validate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [finalize-pr]
    context: fresh
    model: haiku  # extractive: classify PR scope/size, pull numbers/IDs

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh

  - id: code-review
    command: archon-code-review-agent
    depends_on: [sync]
    context: fresh
    model: opus  # correctness, subtle bugs, races, security — wrong-answer cost high

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh
    model: opus  # safety/correctness review — wrong-answer cascades downstream

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh
    model: haiku  # mechanical pattern matching — identify uncovered paths

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh
    model: haiku  # mechanical scan — comment presence/clarity check

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh
    model: haiku  # mechanical scan — identify docs that need updating

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh
    model: opus  # bounded-input synthesis over existing agent findings — decision-heavy

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: FIX REVIEW ISSUES — code-writing → Sonnet
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh
    model: sonnet

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: FINAL SUMMARY & FOLLOW-UP
  # ═══════════════════════════════════════════════════════════════════

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [implement-fixes]
    context: fresh
    model: haiku  # status report-back / final summary — extractive, not decision-heavy
