name: archon-plan-to-pr
description: |
  Use when: You have an existing implementation plan and want to execute it end-to-end.
  Input: Path to a plan file ($ARTIFACTS_DIR/plan.md or .agents/plans/*.md)
  Output: PR ready for merge with comprehensive review completed

  Full workflow:
  1. Read plan, setup branch, extract scope limits
  2. Verify plan research is still valid
  3. Implement all tasks with type-checking
  4. Run full validation suite
  5. Create PR with template, mark ready
  6. Comprehensive code review (5 parallel agents with scope limit awareness)
  7. Synthesize and fix review findings
  8. Final summary with decision matrix -> GitHub comment + follow-up recommendations

  NOT for: Creating plans from scratch (use archon-idea-to-pr), quick fixes, standalone reviews.

provider: claude
# ─── MODEL STRATEGY (queen-bee division of labour) ──────────────────────────
# Workflow default: sonnet
#   Rationale: the heaviest loop-style work is code-writing (implement-tasks,
#   implement-fixes) and read-heavy reasoning (confirm-plan, validate,
#   finalize-pr). Sonnet handles all of these well at ~5× cheaper than Opus.
#
# Explicit Opus overrides (bounded-input, decision-heavy):
#   code-review     — correctness review: subtle bugs, races, security
#   error-handling  — adversarial review of error paths
#   synthesize      — synthesis of 5 parallel review agents' findings
#
# Explicit Haiku overrides (extractive/mechanical):
#   plan-setup      — read plan file, extract branch/scope (pure extraction)
#   review-scope    — PR review-scope summary (mechanical)
#   sync            — git sync status check (mechanical)
#   test-coverage   — mechanical pattern matching
#   comment-quality — mechanical pattern matching
#   docs-impact     — mostly mechanical
#   workflow-summary — final report-back / status summary
#
# No loop nodes present in this workflow, so the loop-node model-stripping
# constraint (loop nodes inherit workflow default, per-node model: is stripped)
# does not apply here.
# ─────────────────────────────────────────────────────────────────────────────
model: sonnet

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: archon-plan-setup
    context: fresh
    model: haiku

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: confirm-plan
    command: archon-confirm-plan
    depends_on: [plan-setup]
    context: fresh
    model: sonnet

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT — grunt code-writing → Sonnet
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-tasks
    command: archon-implement-tasks
    depends_on: [confirm-plan]
    context: fresh
    model: sonnet

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: VALIDATE
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement-tasks]
    context: fresh
    model: sonnet

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINALIZE PR
  # ═══════════════════════════════════════════════════════════════════

  - id: finalize-pr
    command: archon-finalize-pr
    depends_on: [validate]
    context: fresh
    model: sonnet

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [finalize-pr]
    context: fresh
    model: haiku

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh
    model: haiku

  - id: code-review
    command: archon-code-review-agent
    depends_on: [sync]
    context: fresh
    model: opus

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh
    model: opus

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh
    model: haiku

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh
    model: haiku

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh
    model: haiku

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh
    model: opus

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: FIX REVIEW ISSUES — code-writing → Sonnet
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh
    model: sonnet

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: FINAL SUMMARY & FOLLOW-UP
  # ═══════════════════════════════════════════════════════════════════

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [implement-fixes]
    context: fresh
    model: haiku
